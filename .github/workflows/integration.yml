name: Integration tests

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
  pull_request:
    branches: ['*'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  DEV_HOME: /home/gpadmin
  PXF_HOME: /usr/local/greengage-db-devel/pxf
  GPHOME:   /usr/local/greengage-db-devel
  GOPATH:   /opt/go

jobs:
  integration:
    name: Run '${{ matrix.test }}' group with ${{ matrix.fdw && 'FDW' || 'external table' }}${{ matrix.ssl && ' and SSL' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # needs: [build, prepare-cache]

    strategy:
      fail-fast: false
      matrix:
        include:
          -
            test: smoke
          -
            test: gpdb
          -
            test: jdbc
          -
            test: smoke
            fdw: 'true'
          -
            test: gpdb
            fdw: 'true'
          -
            test: jdbc
            fdw: 'true'
          -
            test: ggdbssl
            fdw: 'true'
            ssl: 'true'

    env:
      PROFILE: ${{ matrix.test }}
      GROUP: ${{ matrix.test }}
      USE_FDW: ${{ matrix.fdw }}
      USE_SSL: ${{ matrix.ssl }}
      PXF_HOME: ${{ vars.PXF_HOME }}
      GPHOME: ${{ vars.GPHOME }}
      GOPATH: ${{ vars.GOPATH }}
      PATH: ${{ vars.GPHOME }}/bin:${{ vars.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:${{ vars.GOPATH }}/bin
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      DEBIAN_FRONTEND: noninteractive
      GGDB_IMAGE: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
      IT_TAG: ghcr-latest
      DEBUG: 'true'

    steps:
      # Maximize build space for Docker
      - name: Move /var/lib/docker/
        run: sudo mv /var/lib/docker/ "${GITHUB_WORKSPACE}/docker"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 32
          swap-size-mb: 32
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'false'
          build-mount-path: '/var/lib/docker/'

      - name: Restore /var/lib/docker/
        run: sudo sh -c "mv ${GITHUB_WORKSPACE}/docker/* /var/lib/docker"

      - uses: actions/checkout@v4
      - run: cp /etc/apt/sources.list ./
      - name: Build PXF automation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.${{ github.job }}
          no-cache: true
          push: false
          tags: greengagedb/ggdb6_pxf_automation:${{ env.IT_TAG }}
          build-args: GGDB_IMAGE=${{ env.GGDB_IMAGE }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      - name: Run ${{ matrix.test }} test ${{ matrix.fdw && ' with fdw' || '' }}
        run: |
          set -ex
          cd automation/env
          bash it.sh

      - name: Upload integration tests artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-integration-${{ matrix.test }}${{ matrix.fdw && '-fdw' || '' }}${{ matrix.ssl && '-ssl' || '' }}
          path: automation/env/artifacts/
          retention-days: 7
          if-no-files-found: warn  # Warning if no artifacts are found
