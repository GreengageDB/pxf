# Main CI pipeline orchestrating build, test, and upload stages
name: Greengage CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
  pull_request:
    branches: ['*'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  DEV_HOME: /home/gpadmin
  PXF_HOME: /usr/local/pxf
  GPHOME: /usr/local/greengage-db-devel

jobs:
  # prepare-cache:
  #   name: Prepare Environment Cache
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Install dependencies
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y curl rsync yq docker.io

  #     - name: Build environment cache
  #       run: |
  #         chmod +x ci/build_environment.sh
  #         ci/build_environment.sh

  #     - name: Cache artifacts
  #       uses: actions/cache@v4
  #       with:
  #         path: ~/.cache/greengage
  #         key: env-cache-${{ github.sha }}

  build:
    name: Build PXF Packages
    runs-on: ubuntu-latest
    # needs: [prepare-cache]

    strategy:
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            version: dh-6.29.1
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            dev_home: /home/gpadmin
            version: ghcr-latest

    # Build in developer's Greengage image from GHCR
    container:
      image: ${{ matrix.image }}
      volumes:
        - ${{ github.workspace }}:${{ matrix.dev_home }}/pxf
      env:
        PXF_HOME: ${{ env.PXF_HOME }}
        DEV_HOME: ${{ matrix.dev_home }}
        GPHOME: ${{ env.GPHOME }}
        PATH: ${{ env.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin
        JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install Java and Go
        shell: bash
        run: |
          set -eux
          apt  update
          apt  install -y openjdk-17-jdk
          go_version=$(grep -E '^go [0-9]+\.[0-9]+\.[0-9]+' cli/go.mod | cut -d' ' -f2)
          curl -L https://go.dev/dl/go$go_version.linux-amd64.tar.gz -o go.tar.gz
          tar -C /usr/local -xzf go.tar.gz
          go version

      - name: Build and package
        working-directory: ${{ matrix.dev_home }}/pxf
        shell: bash
        run: |
          set -eux
          git config --global --add safe.directory $(pwd)
          localedef -c -i ru_RU -f CP1251 ru_RU.CP1251
          mkdir -p $GPHOME
          tar -xzf $DEV_HOME/bin_gpdb/bin_gpdb.tar.gz -C $GPHOME/
          source $GPHOME/greengage_path.sh
          make all install deb

      - name: Cache deb packages
        uses: actions/cache@v4
        with:
          path: build/*.deb
          key: pxf-deb-${{ github.sha }}-${{ matrix.version }}

      - name: Upload ${{ github.job }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxf-deb-${{ matrix.version }}
          path: build/*.deb

  integration:
    name: Run '${{ matrix.test }}' group with ${{ matrix.fdw && 'FDW' || 'external table' }}${{ matrix.ssl && ' and SSL' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # needs: [build, prepare-cache]

    strategy:
      fail-fast: false
      matrix:
        include:
          -
            test: smoke
          -
            test: gpdb
          -
            test: jdbc
          -
            test: smoke
            fdw: 'true'
          -
            test: gpdb
            fdw: 'true'
          -
            test: jdbc
            fdw: 'true'
          -
            test: ggdbssl
            fdw: 'true'
            ssl: 'true'

    env:
      GROUP: ${{ matrix.test }}
      USE_FDW: ${{ matrix.fdw }}
      USE_SSL: ${{ matrix.ssl }}
      PXF_HOME: ${{ vars.PXF_HOME }}
      GPHOME: ${{ vars.GPHOME }}
      PATH: ${{ vars.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      DEBIAN_FRONTEND: noninteractive
      GGDB_IMAGE: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
      IT_TAG: ghcr-latest
      DEBUG: 'true'

    steps:
      # Maximize build space for Docker
      - name: Move /var/lib/docker/
        run: sudo mv /var/lib/docker/ "${GITHUB_WORKSPACE}/docker"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 32
          swap-size-mb: 32
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'false'
          build-mount-path: '/var/lib/docker/'

      - name: Restore /var/lib/docker/
        run: sudo sh -c "mv ${GITHUB_WORKSPACE}/docker/* /var/lib/docker"

      - uses: actions/checkout@v4
      - run: mkdir .cache # Directory .cache/ required for docker build
      - name: Build PXF automation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./automation/env/Dockerfile
          push: false
          tags: greengagedb/ggdb6_pxf_automation:${{ env.IT_TAG }}
          build-args: GGDB_IMAGE=${{ env.GGDB_IMAGE }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      - name: Run ${{ matrix.test }} test ${{ matrix.fdw && ' with fdw' || '' }}
        run: |
          set -ex
          cd automation/env
          bash it.sh

      - name: Upload integration tests artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.job }}-${{ matrix.test }}${{ matrix.fdw && '-fdw' || '' }}${{ matrix.ssl && '-ssl' || '' }}
          path: automation/env/artifacts/
          retention-days: 7
          if-no-files-found: warn  # Warning if no artifacts are found

  regression:
    name: Run ${{ github.job }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            version: dh-6.29.1
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
            dev_home: /home/gpadmin
            version: ghcr-latest

    env:
      PXF_HOME: ${{ vars.PXF_HOME }}
      GPHOME: ${{ vars.GPHOME }}
      PATH: ${{ vars.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - name: Build PXF ${{ github.job }} image ${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile
          push: false
          tags: greengagedb/ggdb6_pxf_${{ github.job }}:${{ matrix.version }}
          build-args: GGDB_IMAGE=${{ matrix.image }}

      # Run Regression tests
      - name: Regression tests
        shell: bash
        run: |
          mkdir logs
          docker run --user root:root \
            -v ./logs:/logs \
            --sysctl 'kernel.sem=500 1024000 200 4096' \
            --privileged \
            greengagedb/ggdb6_pxf_${{ github.job }}:${{ matrix.version }} \
            bash -c "
              set +e
              cd /tmp/build || status=1
              pxf_src/ci/test_in_docker.sh
              status=\$?
              find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
              echo \">>> STATUS \$status\"
              exit \${status:-1}
            "

      # Upload regression tests artifacts
      - name: Upload ${{ github.job }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ github.job }-${{ matrix.version }}
          path: logs
          retention-days: 7
          if-no-files-found: warn  # Warning if no artifacts are found
