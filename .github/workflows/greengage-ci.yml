# Main CI pipeline orchestrating build, test, and upload stages
name: Greengage CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
  pull_request:
    branches: ['*'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  DEV_HOME: /home/gpadmin
  PXF_HOME: /usr/local/greengage-db-devel/pxf
  GPHOME:   /usr/local/greengage-db-devel
  GOPATH:   /opt/go

jobs:
  build:
    name: Build PXF Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            release: stable
            version: '6'
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            release: devel
            version: '6'
          - image: greengagedb/ggdb7_ubuntu:7.4.0
            release: stable
            version: '7'
          - image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
            release: devel
            version: '7'

    container:
      image: ${{ matrix.image }}
      volumes:
        - ${{ github.workspace }}:/home/gpadmin/pxf
      env:
        PXF_HOME: ${{ env.PXF_HOME }}
        DEV_HOME: /home/gpadmin
        PXF_SRC: /home/gpadmin/pxf
        GPHOME: ${{ env.GPHOME }}
        GOPATH: ${{ env.GOPATH }}
        PATH: ${{ env.GPHOME }}/bin:${{ env.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:${{ env.GOPATH }}/bin
        JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker
        shell: bash
        run: |
          set -eux
          cd $PXF_SRC
          bash ci/build_in_docker.sh
          git config --global --add safe.directory $PXF_SRC
          make deb
      - name: Cache deb packages
        uses: actions/cache@v4
        with:
          path: build/*.deb
          key: pxf-deb-${{ github.sha }}-${{ matrix.version }}-${{ matrix.release }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxf-deb-${{ matrix.version }}-${{ matrix.release }}
          path: build/*.deb

  # This job holds the list of tests
  integration:
    if: false # fake job for configuration multi-matrix tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test: smoke
          - test: gpdb
          - test: jdbc
          - test: smoke
            fdw: 'true'
          - test: gpdb
            fdw: 'true'
          - test: jdbc
            fdw: 'true'
          - test: ggdbssl
            fdw: 'true'
            ssl: 'true'
    steps:
      - name: Fake step
        run: echo "This is fake configuration job and this"

  # Job to generate the combined matrix
  integration-matrix-gen:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix_output }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install yq and jq (usually pre-installed on GitHub runners)
        # Ensure yq v4+ is available (e.g., using a setup action if needed)
        run: |
          echo "yq version: $(yq --version)"
          echo "jq version: $(jq --version)"

      - name: Generate combined matrix configurations
        id: generate-matrix
        run: |
          YAML_FILE="${GITHUB_WORKSPACE}/.github/workflows/greengage-ci.yml"
          IMAGES_JSON=$(yq eval '.jobs.build.strategy.matrix.include' "$YAML_FILE" -o=json)
          TESTS_JSON=$(yq eval '.jobs.integration.strategy.matrix.include' "$YAML_FILE" -o=json)
          COMBINED_MATRIX=$(echo "$IMAGES_JSON" "$TESTS_JSON" | jq -s '
            .[0] as $images |
            .[1] as $tests |
            [
              $images[] as $image |
              $tests[] as $test |
              $image + $test
            ]
          ')
          echo "matrix_output=$COMBINED_MATRIX" >> "$GITHUB_OUTPUT"

  # Job that runs based on the dynamically generated matrix
  integration-matrix:
    needs: integration-matrix-gen
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ needs.integration-matrix-gen.outputs.matrix }}
    timeout-minutes: 180
    
    name: IT '${{ matrix.test }}' with ${{ matrix.fdw && 'FDW' || 'external table' }}${{ matrix.ssl && ' and SSL' || '' }} on ${{ matrix.image }}
    
    env:
      PROFILE: ${{ matrix.test }}
      GROUP: ${{ matrix.test }}
      USE_FDW: ${{ matrix.fdw }}
      USE_SSL: ${{ matrix.ssl }}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      DEBIAN_FRONTEND: noninteractive
      GGDB_IMAGE: ${{ matrix.image }}
      IT_IMAGE: greengagedb/ggdb${{ matrix.version }}_pxf_automation_${{ matrix.release }}
      IT_TAG: it
      DEBUG: 'true'
      DEBUG_DIR: 'artifacts/docker_logs'

    steps:
      - name: Debug works message
        run: |
          echo "Running test: ${{ matrix.test }}"
          echo "Using image: ${{ matrix.image }}"
          if [ "${{ matrix.fdw }}" == "true" ]; then
            echo "FDW is enabled."
          fi
          if [ "${{ matrix.ssl }}" == "true" ]; then
            echo "SSL is enabled."
          fi

      # Maximize build space for Docker
      - name: Move /var/lib/docker/
        run: sudo mv /var/lib/docker/ "${GITHUB_WORKSPACE}/docker"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 32
          swap-size-mb: 32
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'false'
          build-mount-path: '/var/lib/docker/'

      - run: sudo sh -c "mv ${GITHUB_WORKSPACE}/docker/* /var/lib/docker"
      - uses: actions/checkout@v4
      - run: cp /etc/apt/sources.list ./
      - name: Build '${{ env.IT_IMAGE }}:${{ env.IT_TAG }}' image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.${{ github.job }}
          no-cache: true
          push: false
          tags: ${{ env.IT_IMAGE }}:${{ env.IT_TAG }}
          build-args: GGDB_IMAGE=${{ env.GGDB_IMAGE }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      - name: Run '${{ matrix.test }}' test with ${{ matrix.fdw && 'FDW' || 'external table' }}${{ matrix.ssl && ' and SSL' || '' }}
        run: |
          set -ex
          cd automation/env
          bash it.sh

      - name: Upload integration tests artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-integration-${{ matrix.test }}${{ matrix.fdw && '-fdw' || '' }}${{ matrix.ssl && '-ssl' || '' }}
          path: automation/env/artifacts/
          retention-days: 7
          if-no-files-found: warn

  regression:
    name: Regression on ${{ matrix.release }} v${{ matrix.version }} image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            version: dh-6.29.1
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
            dev_home: /home/gpadmin
            version: ghcr-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build PXF regression image ${{ matrix.release }} v${{ matrix.version }} 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.${{ github.job }}
          push: false
          tags: greengagedb/ggdb6_pxf_regression:${{ matrix.version }}-${{ matrix.release }}
          build-args: GGDB_IMAGE=${{ matrix.image }}

      - name: Run regression on ${{ matrix.release }} v${{ matrix.version }} image
        shell: bash
        run: |
          mkdir logs
          docker run --user root:root \
            -v ./logs:/logs \
            --sysctl 'kernel.sem=500 1024000 200 4096' \
            --privileged \
            greengagedb/ggdb6_pxf_regression:${{ matrix.version }}-${{ matrix.release }} \
            bash -c "
              set +e
              cd /tmp/build || status=1
              pxf_src/ci/test_in_docker.sh
              status=\$?
              find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
              echo \">>> STATUS \$status\"
              exit \${status:-1}
            "

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_regression-${{ matrix.version }}-${{ matrix.release }}
          path: logs
          retention-days: 7
          if-no-files-found: warn
