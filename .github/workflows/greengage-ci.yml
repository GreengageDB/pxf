# Main CI pipeline orchestrating build, test, and upload stages
name: Greengage CI
env:
  GG_CUSTOM_BRANCH: GG-246

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
    tags: ['**']   # Trigger on tags for versioned releases
  pull_request:
    branches: ['**'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  build:
    if: ${{ GG_CUSTOM_BRANCH }} == ''
    name: Build on ggdb${{ matrix.version }}-${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            release: stable
            version: '6'
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            release: devel
            version: '6'
          - image: greengagedb/ggdb7_ubuntu:7.4.0
            release: stable
            version: '7'
          - image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
            release: devel
            version: '7'
    env:
      GREENGAGE_DEB:     Package/greengage.deb
      GREENGAGE_DEB_URL: https://github.com/GreengageDB/greengage/releases/download/6.29.2/greengage6.deb
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker using docker run
        env:
          DEV_HOME: /home/gpadmin
          PXF_HOME: /opt/greengagedb/greengage/pxf
          GPHOME: /opt/greengagedb/greengage
          GOPATH: /opt/go
          PXF_SRC: /home/gpadmin/pxf
          PATH: /opt/greengagedb/greengage/bin:/opt/greengagedb/greengage/pxf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:/opt/go/bin
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
          DEBIAN_FRONTEND: noninteractive
          GREENGAGE_DEB: ${{ env.GREENGAGE_DEB }}
          GREENGAGE_DEB_URL: ${{ env.GREENGAGE_DEB_URL }}
        run: |
          set -eu
          mkdir -p "$(dirname $GREENGAGE_DEB)"
          curl -L $GREENGAGE_DEB_URL -o $GREENGAGE_DEB
          docker run \
            --rm \
            -v ${{ github.workspace }}:$PXF_SRC \
            -w $PXF_SRC \
            -e DEV_HOME \
            -e PXF_HOME \
            -e GPHOME \
            -e GOPATH \
            -e PXF_SRC \
            -e PATH \
            -e JAVA_TOOL_OPTIONS \
            -e DEBIAN_FRONTEND \
            -e GREENGAGE_DEB \
            -e GREENGAGE_DEB_URL \
            ${{ matrix.image }} \
            /bin/bash ci/build_in_docker.sh

      - name: Test Package install in Ubuntu 22.04 (docker)
        env:
          GREENGAGE_DEB: ${{ env.GREENGAGE_DEB }}
          DEBIAN_FRONTEND: noninteractive
          TEST_DOCKER_IMAGE: ubuntu:22.04
        run: |
          set -eu
          docker run \
            --rm \
            -v ./Package:/deb-packages \
            -e DEBIAN_FRONTEND \
            $TEST_DOCKER_IMAGE \
            /bin/bash -c "
              set -e
              apt-get update 
              { apt-get install -yq /deb-packages/*.deb 2>&1 || dpkg -i /deb-packages/*.deb 2>&1; }
              apt-get install -yqf
            "
            rm -f $GREENGAGE_DEB

      - name: Rename Package artifacts
        run: mv Package deb-packages-${{ matrix.version }}-${{ matrix.release }}

      - name: Cache Package artifacts
        uses: actions/cache/save@v4
        with:
          path: deb-packages-${{ matrix.version }}-${{ matrix.release }}
          key:  deb-packages-${{ matrix.version }}-${{ matrix.release }}-${{ github.sha }}

      - name: Upload Package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-${{ matrix.version }}-${{ matrix.release }}
          path: deb-packages-${{ matrix.version }}-${{ matrix.release }}

  regression:
    if: ${{ GG_CUSTOM_BRANCH }} == ''
    name: Regression on ggdb${{ matrix.version }}-${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            release: stable
            version: '6'
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            release: devel
            version: '6'
          - image: greengagedb/ggdb7_ubuntu:7.4.0
            release: stable
            version: '7'
          - image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
            release: devel
            version: '7'

    steps:
      - uses: actions/checkout@v4
      - name: Build PXF regression on ggdb${{ matrix.version }}-${{ matrix.release }} 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.${{ github.job }}
          push: false
          tags: greengagedb/ggdb${{ matrix.version }}_pxf_regression:${{ matrix.release }}
          build-args: GGDB_IMAGE=${{ matrix.image }}

      - name: Run regression on ggdb${{ matrix.version }}-${{ matrix.release }}
        shell: bash
        run: |
          mkdir logs
          docker run --user root:root \
            -v ./logs:/logs \
            --sysctl 'kernel.sem=500 1024000 200 4096' \
            --privileged \
            greengagedb/ggdb${{ matrix.version }}_pxf_regression:${{ matrix.release }} \
            bash -c "
              set +e
              cd /tmp/build || status=1
              pxf_src/ci/test_in_docker.sh
              status=\$?
              find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
              echo \">>> STATUS \$status\"
              exit \${status:-1}
            "

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-ggdb${{ matrix.version }}-${{ matrix.release }}
          path: logs
          retention-days: 7
          if-no-files-found: warn

  integration-ggdb6-stable:
    if: ${{ GG_CUSTOM_BRANCH }} == ''
    name: Integration on ggdb6-stable
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb6_ubuntu:6.29.1
      version: '6'
      release: stable
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb6-devel:
    if: ${{ GG_CUSTOM_BRANCH }} == ''
    name: Integration on ggdb6-devel
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:6.29.1
      version: '6'
      release: devel
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb7-stable:
    if: ${{ GG_CUSTOM_BRANCH }} == ''
    name: Integration on ggdb7-stable
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb7_ubuntu:7.4.0
      version: '7'
      release: stable
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb7-devel:
    if: ${{ GG_CUSTOM_BRANCH }} == ''
    name: Integration on ggdb7-devel
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
      version: '7'
      release: devel
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb6-custom:
    if: ${{ GG_CUSTOM_BRANCH }} != ''
    name: Integration on ggdb6-custom '$GG_CUSTOM_BRANCH'
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb6_ubuntu:$GG_CUSTOM_BRANCH
      version: '6'
      release: custom
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb7-custom:
    if: ${{ GG_CUSTOM_BRANCH }} != ''
    name: Integration on ggdb7-custom '$GG_CUSTOM_BRANCH'
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb7_ubuntu:$GG_CUSTOM_BRANCH
      version: '7'
      release: custom
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]
