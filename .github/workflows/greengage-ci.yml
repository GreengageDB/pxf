# Main CI pipeline orchestrating build, test, and upload stages
name: Greengage CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
  pull_request:
    branches: ['*'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  DEV_HOME: /home/gpadmin
  PXF_HOME: /usr/local/greengage-db-devel/pxf
  GPHOME:   /usr/local/greengage-db-devel
  GOPATH:   /opt/go
  TESTS_MATRIX: |
    [
      { "test": "smoke" },
      { "test": "gpdb" },
      { "test": "jdbc" },
      { "test": "smoke", "fdw": "true" },
      { "test": "gpdb", "fdw": "true" },
      { "test": "jdbc", "fdw": "true" },
      { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
    ]

jobs:
  build:
    name: Build PXF on ${{ matrix.release }} image v${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            release: stable
            version: '6'
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            release: devel
            version: '6'
          - image: greengagedb/ggdb7_ubuntu:7.4.0
            release: stable
            version: '7'
          - image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
            release: devel
            version: '7'

    container:
      image: ${{ matrix.image }}
      volumes:
        - ${{ github.workspace }}:/home/gpadmin/pxf
      env:
        PXF_HOME: ${{ env.PXF_HOME }}
        DEV_HOME: /home/gpadmin
        PXF_SRC: /home/gpadmin/pxf
        GPHOME: ${{ env.GPHOME }}
        GOPATH: ${{ env.GOPATH }}
        PATH: ${{ env.GPHOME }}/bin:${{ env.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:${{ env.GOPATH }}/bin
        JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker
        shell: bash
        run: |
          set -eux
          cd $PXF_SRC
          bash ci/build_in_docker.sh
          git config --global --add safe.directory $PXF_SRC
          # make deb
      # - name: Cache deb packages
      #   uses: actions/cache@v4
      #   with:
      #     path: build/*.deb
      #     key: pxf-deb-${{ github.sha }}-${{ matrix.version }}-${{ matrix.release }}
      # - name: Upload build artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: pxf-deb-${{ matrix.version }}-${{ matrix.release }}
      #     path: build/*.deb

  regression:
    name: Regression on ${{ matrix.release }} v${{ matrix.version }} image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            release: stable
            version: '6'
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            release: devel
            version: '6'
          - image: greengagedb/ggdb7_ubuntu:7.4.0
            release: stable
            version: '7'
          - image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
            release: devel
            version: '7'

    steps:
      - uses: actions/checkout@v4
      - name: Build PXF regression ${{ matrix.release }} image v${{ matrix.version }} 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.${{ github.job }}
          push: false
          tags: greengagedb/ggdb${{ matrix.version }}_pxf_regression:${{ matrix.version }}-${{ matrix.release }}
          build-args: GGDB_IMAGE=${{ matrix.image }}

      - name: Run regression on ${{ matrix.release }} image v${{ matrix.version }}
        shell: bash
        run: |
          mkdir logs
          docker run --user root:root \
            -v ./logs:/logs \
            --sysctl 'kernel.sem=500 1024000 200 4096' \
            --privileged \
            greengagedb/ggdb${{ matrix.version }}_pxf_regression:${{ matrix.version }}-${{ matrix.release }} \
            bash -c "
              set +e
              cd /tmp/build || status=1
              pxf_src/ci/test_in_docker.sh
              status=\$?
              find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
              echo \">>> STATUS \$status\"
              exit \${status:-1}
            "

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_regression-${{ matrix.version }}-${{ matrix.release }}
          path: logs
          retention-days: 7
          if-no-files-found: warn

  integration-ggdb6-stable:
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb6_ubuntu:6.29.1
      version: '6'
      release: stable
      tests_matrix: ${{ env.TESTS_MATRIX }}


  integration-ggdb6-devel:
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
      version: '6'
      release: devel
      tests_matrix: ${{ env.TESTS_MATRIX }}

  integration-ggdb7-stable:
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb7_ubuntu:7.4.0
      version: '7'
      release: stable
      tests_matrix: ${{ env.TESTS_MATRIX }}

  integration-ggdb7-devel:
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
      version: '7'
      release: devel
      tests_matrix: ${{ env.TESTS_MATRIX }}
