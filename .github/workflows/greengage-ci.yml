# .github/workflows/greengage-ci.yml
name: Greengage PXF CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
    tags: ['**']   # Trigger on tags for versioned releases
  pull_request:
    branches: ['**'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  IMAGES: |
    [
      { "version": "6", "image": "ghcr.io/greengagedb/greengage/ggdb", "tag": "GG-389" }
    ]
  TESTS: |
    [
      { "test": "smoke" },
      { "test": "gpdb" },
      { "test": "jdbc" },
      { "test": "smoke",   "fdw": "true" },
      { "test": "gpdb",    "fdw": "true" },
      { "test": "jdbc",    "fdw": "true" },
      { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
    ]

jobs:
  generate-matrix:
    name: Generate CI matrix
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      tests:  ${{ steps.tests.outputs.tests }}
    steps:
      - name: Generate images mtrix
        id: images
        run: |
          cat > /tmp/images.json << 'JSON_END'
          ${{ env.IMAGES }}
          JSON_END
          echo "matrix=$(jq -c . /tmp/images.json)" >> $GITHUB_OUTPUT

      - name: Generate tests mtrix
        id: tests
        run: |
          cat > /tmp/tests.json << 'JSON_END'
          ${{ env.TESTS }}
          JSON_END
          echo "tests=$(jq -c . /tmp/tests.json)" >> $GITHUB_OUTPUT

  build:
    needs: generate-matrix
    name: Build DEB package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build for version 6
          - tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[0].tag }}
            image:   ${{ fromJson(needs.generate-matrix.outputs.images)[0].image }}
            version: ${{ fromJson(needs.generate-matrix.outputs.images)[0].version }}
          # Build for version 7
          - tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[1].tag }}
            image:   ${{ fromJson(needs.generate-matrix.outputs.images)[1].image }}
            version: ${{ fromJson(needs.generate-matrix.outputs.images)[1].version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build/deb
        with:
          tag:     ${{ matrix.tag }}
          image:   ${{ matrix.image }}
          version: ${{ matrix.version }}

  regression:
    needs: generate-matrix
    name: Regression on ggdb${{ matrix.version }}:${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tests/regression
        with:
          tag:     ${{ matrix.tag }}
          image:   ${{ matrix.image }}
          version: ${{ matrix.version }}

  integration-0:
    needs: generate-matrix
    name: Integration on ggdb${{ fromJson(needs.generate-matrix.outputs.images)[0].version }}:${{ fromJson(needs.generate-matrix.outputs.images)[0].tag }}
    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[0].tag }}
      image:   ${{ fromJson(needs.generate-matrix.outputs.images)[0].image }}
      version: ${{ fromJson(needs.generate-matrix.outputs.images)[0].version }}
      tests: ${{ needs.generate-matrix.outputs.tests }}
