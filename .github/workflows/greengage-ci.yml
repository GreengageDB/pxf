# Main CI pipeline orchestrating build, test, and upload stages
name: Greengage CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
  pull_request:
    branches: ['*'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  DEV_HOME: /home/gpadmin
  PXF_HOME: /usr/local/greengage-db-devel/pxf
  GPHOME:   /usr/local/greengage-db-devel
  GOPATH:   /opt/go

jobs:
  build:
    name: Build PXF Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            version: dh-6.29.1
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            dev_home: /home/gpadmin
            version: ghcr-latest
    container:
      image: ${{ matrix.image }}
      volumes:
        - ${{ github.workspace }}:${{ matrix.dev_home }}/pxf
      env:
        PXF_HOME: ${{ env.PXF_HOME }}
        DEV_HOME: ${{ matrix.dev_home }}
        PXF_SRC: ${{ matrix.dev_home }}/pxf
        GPHOME: ${{ env.GPHOME }}
        GOPATH: ${{ env.GOPATH }}
        PATH: ${{ env.GPHOME }}/bin:${{ env.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:${{ env.GOPATH }}/bin
        JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker
        shell: bash
        run: |
          set -eux
          cd $PXF_SRC
          bash ci/build_in_docker.sh
          git config --global --add safe.directory $PXF_SRC
          make deb
      - name: Cache deb packages
        uses: actions/cache@v4
        with:
          path: build/*.deb
          key: pxf-deb-${{ github.sha }}-${{ matrix.version }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxf-deb-${{ matrix.version }}
          path: build/*.deb

  integration:
    name: IT '${{ matrix.test }}' with ${{ matrix.fdw && 'FDW' || 'external table' }}${{ matrix.ssl && ' and SSL' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - test: smoke
          - test: gpdb
          - test: jdbc
          - test: smoke
            fdw: 'true'
          - test: gpdb
            fdw: 'true'
          - test: jdbc
            fdw: 'true'
          - test: ggdbssl
            fdw: 'true'
            ssl: 'true'

    env:
      PROFILE: ${{ matrix.test }}
      GROUP: ${{ matrix.test }}
      USE_FDW: ${{ matrix.fdw }}
      USE_SSL: ${{ matrix.ssl }}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      DEBIAN_FRONTEND: noninteractive
      GGDB_IMAGE: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
      IT_IMAGE: greengagedb/ggdb6_pxf_automation:ghcr-latest
      IT_TAG: ghcr-latest
      DEBUG: 'true'

    steps:
      # Maximize build space for Docker
      - name: Move /var/lib/docker/
        run: sudo mv /var/lib/docker/ "${GITHUB_WORKSPACE}/docker"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 32
          swap-size-mb: 32
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'false'
          build-mount-path: '/var/lib/docker/'

      - run: sudo sh -c "mv ${GITHUB_WORKSPACE}/docker/* /var/lib/docker"
      - uses: actions/checkout@v4
      - run: cp /etc/apt/sources.list ./
      - name: Build '${{ env.IT_IMAGE }}' image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.${{ github.job }}
          no-cache: true
          push: false
          tags: ${{ env.IT_IMAGE }}
          build-args: GGDB_IMAGE=${{ env.GGDB_IMAGE }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      - name: Run '${{ matrix.test }}' test with ${{ matrix.fdw && 'FDW' || 'external table' }}${{ matrix.ssl && ' and SSL' || '' }}
        run: |
          set -ex
          cd automation/env
          bash it.sh

      - name: Upload integration tests artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-integration-${{ matrix.test }}${{ matrix.fdw && '-fdw' || '' }}${{ matrix.ssl && '-ssl' || '' }}
          path: automation/env/artifacts/
          retention-days: 7
          if-no-files-found: warn

  regression:
    name: Regression on ${{ matrix.version }} image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            version: dh-6.29.1
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
            dev_home: /home/gpadmin
            version: ghcr-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build PXF regression image ${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.${{ github.job }}
          push: false
          tags: greengagedb/ggdb6_pxf_regression:${{ matrix.version }}
          build-args: GGDB_IMAGE=${{ matrix.image }}

      - name: Run regression on ${{ matrix.version }} image
        shell: bash
        run: |
          mkdir logs
          docker run --user root:root \
            -v ./logs:/logs \
            --sysctl 'kernel.sem=500 1024000 200 4096' \
            --privileged \
            greengagedb/ggdb6_pxf_regression:${{ matrix.version }} \
            bash -c "
              set +e
              cd /tmp/build || status=1
              pxf_src/ci/test_in_docker.sh
              status=\$?
              find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
              echo \">>> STATUS \$status\"
              exit \${status:-1}
            "

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_regression-${{ matrix.version }}
          path: logs
          retention-days: 7
          if-no-files-found: warn
