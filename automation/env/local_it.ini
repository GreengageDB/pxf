; Local integration test configuration
; 
; How it works:
; - [general] - basic settings (images, debug, etc.)
; - [default] - default values reset before each test section
; - [test_section] - test configuration with description as section name
; 
; Each test section must define:
;   GROUP - test group name (used in reporting)
;   PROFILE - test profile (defaults to 'all' if not specified)
; 
; Section names are used as descriptions in output.
; Use underscores instead of spaces in section names.
;
; IMPORTANT: Parameter values from sections are passed directly to bash
; and may contain environment variables and any bash constructs.
; Example: STARTED_AT=$(date)
; Use with caution - values are executed as bash code!

[general]
STARTED_AT=$(date) # bash-ececution example
GGDB_IMAGE=ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
IT_IMAGE=greengagedb/ggdb6_pxf_automation
IT_TAG=it
DEBUG_DIR=artifacts/docker_logs
DEBUG=true

[default]
PROFILE=all
USE_FDW=
USE_SSL=

; Tests with external table
#[Smoke_External_Table]
GROUP=smoke
PROFILE=smoke

#[GPDB_External_Table]
GROUP=gpdb
PROFILE=gpdb

#[JDBC_External_Table]
GROUP=jdbc
PROFILE=jdbc

; Tests with FDW
#[Smoke_With_FDW]
GROUP=smoke
PROFILE=smoke
USE_FDW=1

#[GPDB_With_FDW]
GROUP=gpdb
PROFILE=gpdb
USE_FDW=1

#[JDBC_With_FDW]
GROUP=jdbc
PROFILE=jdbc
USE_FDW=1

; GGDB with FDW and SSL
[GGDB_With_FDW_SSL]
GROUP=ggdbssl
PROFILE=ggdbssl
USE_FDW=1
USE_SSL=1
